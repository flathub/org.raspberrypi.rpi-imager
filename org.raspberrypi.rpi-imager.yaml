app-id: org.raspberrypi.rpi-imager
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: rpi-imager
rename-desktop-file: com.raspberrypi.rpi-imager.desktop
rename-appdata-file: com.raspberrypi.rpi-imager.metainfo.xml
rename-icon: rpi-imager
finish-args:
  - --device=all
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --talk-name=org.freedesktop.Notifications
  - --system-talk-name=org.freedesktop.UDisks2
modules:
  - name: rpi-imager
    buildsystem: cmake-ninja
    build-options:
      # Qt is built with reduced relocations. Compile the executable as PIC so
      # exported Qt data (notably QCoreApplication::self) is not copy-relocated.
      cflags: -fPIC
      cxxflags: -fPIC
    subdir: src
    builddir: false
    config-opts:
      - -DENABLE_CHECK_VERSION:BOOL=OFF
      - -DENABLE_TELEMETRY:BOOL=OFF
      - -DCMAKE_BUILD_TYPE=MinSizeRel
      - -DFETCHCONTENT_FULLY_DISCONNECTED=ON
      - -DGENERATE_TIMEZONES_FROM_IANA=OFF
      - -DGENERATE_COUNTRIES_FROM_REGDB=OFF
      - -DFETCHCONTENT_SOURCE_DIR_XZ=_deps/xz-src
      - -DFETCHCONTENT_SOURCE_DIR_ZSTD=_deps/zstd-src
      - -DFETCHCONTENT_SOURCE_DIR_NGHTTP2=_deps/nghttp2-src
      - -DFETCHCONTENT_SOURCE_DIR_ZLIB=_deps/zlib-src
      - -DFETCHCONTENT_SOURCE_DIR_LIBARCHIVE=_deps/libarchive-src
      - -DFETCHCONTENT_SOURCE_DIR_CURL=_deps/curl-src
      - -DFETCHCONTENT_SOURCE_DIR_LIBUSB=_deps/libusb-src
    post-install:
      - desktop-file-edit --set-key=Exec --set-value='rpi-imager %u' "${FLATPAK_DEST}/share/applications/com.raspberrypi.rpi-imager.desktop"
      - install -Dm644 ../license.txt "${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/rpi-imager/license.txt"
      - install -Dm644 _deps/xz-src/COPYING "${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/xz/COPYING"
      - install -Dm644 _deps/xz-src/COPYING.0BSD "${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/xz/COPYING.0BSD"
      - install -Dm644 _deps/zstd-src/LICENSE "${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/zstd/LICENSE"
      - install -Dm644 _deps/nghttp2-src/COPYING "${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/nghttp2/COPYING"
      - install -Dm644 _deps/zlib-src/LICENSE "${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/zlib/LICENSE"
      - install -Dm644 _deps/libarchive-src/COPYING "${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/libarchive/COPYING"
      - install -Dm644 _deps/curl-src/COPYING "${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/curl/COPYING"
      - install -Dm644 _deps/libusb-src/COPYING "${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/libusb/COPYING"
    cleanup:
      - /lib/udev
    sources:
      - type: git
        url: https://github.com/raspberrypi/rpi-imager.git
        tag: v2.0.11.1
        commit: f259e1c99007b8a84b4e0049f03f0c34050f38e0
        disable-submodules: true
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
          is-main-source: true

      # Downstream patches should not add a -dirty suffix to the pinned release.
      - type: patch
        path: fix-package-version.patch

      - type: patch
        path: fix-appstream.patch

      # Offline builds must still embed the bundled time-zone list.
      - type: patch
        path: fix-offline-timezones.patch

      # Delegate block-device authorization and unmounting to host UDisks2
      - type: patch
        path: fix-flatpak-authorization.patch

      # Pre-populate XZ/LZMA dependency
      - type: git
        url: https://github.com/tukaani-project/xz.git
        tag: v5.8.3
        commit: 4b73f2ec19a99ef465282fbce633e8deb33691b3
        dest: src/_deps/xz-src
        disable-submodules: true

      # Pre-populate zstd dependency
      - type: git
        url: https://github.com/facebook/zstd.git
        tag: v1.5.7
        commit: f8745da6ff1ad1e7bab384bd1f9d742439278e99
        dest: src/_deps/zstd-src
        disable-submodules: true

      # Pre-populate nghttp2 dependency
      - type: git
        url: https://github.com/nghttp2/nghttp2.git
        tag: v1.69.0
        commit: 68cb6900fde14c77f0cd7add0e094a862960eb99
        dest: src/_deps/nghttp2-src
        disable-submodules: true

      # Avoid rpi-imager's config.h shadowing nghttp2's generated config.h
      - type: patch
        path: fix-nghttp2-config-header.patch

      # Pre-populate zlib dependency
      - type: git
        url: https://github.com/madler/zlib.git
        tag: v1.3.2
        commit: da607da739fa6047df13e66a2af6b8bec7c2a498
        dest: src/_deps/zlib-src
        disable-submodules: true

      # Pre-populate libarchive dependency
      - type: git
        url: https://github.com/libarchive/libarchive.git
        tag: v3.8.7
        commit: ded82291ab41d5e355831b96b0e1ff49e24d8939
        dest: src/_deps/libarchive-src
        disable-submodules: true

      # Pre-populate curl dependency
      - type: git
        url: https://github.com/curl/curl.git
        tag: curl-8_20_0
        commit: a05f34973e6c4bb629d018f7cb51487be1c904d8
        dest: src/_deps/curl-src
        disable-submodules: true

      # Pre-populate libusb dependency
      - type: git
        url: https://github.com/libusb/libusb.git
        tag: v1.0.30
        commit: 87a55632db62c9bdc58cd31d3ccfa673f1bb017f
        dest: src/_deps/libusb-src
        disable-submodules: true
