app-id: org.raspberrypi.rpi-imager
runtime: org.kde.Platform
runtime-version: '6.9'
sdk: org.kde.Sdk
command: rpi-imager
rename-icon: rpi-imager
finish-args:
  - --device=all
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --filesystem=/media
  - --filesystem=/run/media
  - --talk-name=org.a11y.*
  - --talk-name=org.freedesktop.Notifications
  - --system-talk-name=org.freedesktop.UDisks2
modules:
  - name: rpi-imager
    config-opts:
      - -DENABLE_CHECK_VERSION:BOOL=OFF
      - -DENABLE_TELEMETRY:BOOL=OFF
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DFETCHCONTENT_FULLY_DISCONNECTED=ON
      - -DFETCHCONTENT_SOURCE_DIR_XZ=./_deps/xz-src
      - -DFETCHCONTENT_SOURCE_DIR_ZSTD=./_deps/zstd-src
      - -DFETCHCONTENT_SOURCE_DIR_NGHTTP2=./_deps/nghttp2-src
      - -DFETCHCONTENT_SOURCE_DIR_ZLIB=./_deps/zlib-src
      - -DFETCHCONTENT_SOURCE_DIR_LIBARCHIVE=./_deps/libarchive-src
      - -DFETCHCONTENT_SOURCE_DIR_CURL=./_deps/curl-src
      - -DBUILD_CLI_ONLY=OFF
    buildsystem: cmake-ninja
    builddir: false
    subdir: src
    post-install:
      - rm "${FLATPAK_DEST}/share/metainfo/org.raspberrypi.rpi-imager.metainfo.xml"
      - install -Dm644 ../org.raspberrypi.rpi-imager.metainfo.xml -t "${FLATPAK_DEST}/share/metainfo/"
      - desktop-file-edit --set-key=Exec --set-value='/app/bin/rpi-imager %F' "${FLATPAK_DEST}/share/applications/org.raspberrypi.rpi-imager.desktop"
    sources:
      - type: archive
        url: https://github.com/raspberrypi/rpi-imager/archive/refs/tags/v2.0.3.tar.gz
        sha256: 71143495c6a228557f763249de4da3050cf8d0f7eaadde6b5e64819699fb7f45
        x-checker-data:
          type: json
          url: https://api.github.com/repos/raspberrypi/rpi-imager/releases/latest
          version-query: .tag_name | sub("^v"; "")
          timestamp-query: .published_at
          url-query: |
            "https://github.com/raspberrypi/rpi-imager/archive/refs/tags/v" + $version + ".tar.gz"

      # Pre-populate XZ/LZMA dependency
      - type: git
        url: https://github.com/tukaani-project/xz.git
        tag: v5.8.1
        commit: a522a226545730551f7e7c2685fab27cf567746c
        dest: src/_deps/xz-src

      # Pre-populate zstd dependency
      - type: git
        url: https://github.com/facebook/zstd.git
        tag: v1.5.7
        commit: f8745da6ff1ad1e7bab384bd1f9d742439278e99
        dest: src/_deps/zstd-src

      # Pre-populate nghttp2 dependency
      - type: git
        url: https://github.com/nghttp2/nghttp2.git
        tag: v1.67.1
        commit: 49908f992027821912b96a13898b665a35aa3a0a
        dest: src/_deps/nghttp2-src

      # Pre-populate zlib dependency - use specific commit hash
      - type: git
        url: https://github.com/madler/zlib.git
        commit: 5a82f71ed1dfc0bec044d9702463dbdf84ea3b71
        dest: src/_deps/zlib-src

      # Pre-populate libarchive dependency
      - type: git
        url: https://github.com/libarchive/libarchive.git
        tag: v3.8.1
        commit: 9525f90ca4bd14c7b335e2f8c84a4607b0af6bdf
        dest: src/_deps/libarchive-src

        # Pre-populate curl dependency
      - type: git
        url: https://github.com/curl/curl.git
        tag: curl-8_17_0
        commit: 400fffa90f30c7a2dc762fa33009d24851bd2016
        dest: src/_deps/curl-src

      - type: file
        path: capital-cities.json
        dest: src/

      - type: file
        path: tzdata2025c.tar.gz
        dest: src/

      - type: file
        path: wireless-regdb.txt
        dest: src/

      - type: file
        path: org.raspberrypi.rpi-imager.metainfo.xml

      - type: patch
        path: rename_app_id.patch

      - type: patch
        path: diable_telemetry.patch

      - type: patch
        path: use_local_localisation_sources.patch

      - type: patch
        path: disable_LTO.patch

      #- type: patch
      #  path: curl.patch
